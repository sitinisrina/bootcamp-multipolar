---
- name: Ensure required tooling is installed, validated and logged in
  hosts: all
  any_errors_fatal: true

  vars:
    git_repo_url: "https://github.com/ansible/ansible-examples.git"
    git_dest: "/home/{{ ansible_user }}/repo"

    podman_registry_url: "quay.io"
    podman_registry_username: ""
    podman_registry_password: ""

    oc_api_url: "https://api.example.com:6443"
    oc_token: ""
    oc_cli_download_url: "https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/stable/openshift-client-linux.tar.gz"

  pre_tasks:
    # --- Pre-validation: format input ---
    - name: Validate git repository URL
      ansible.builtin.assert:
        that:
          - git_repo_url is match('^https://.+\.git$')
        fail_msg: "git_repo_url harus diawali https:// dan diakhiri .git (sekarang: {{ git_repo_url }})"
        success_msg: "git_repo_url valid"

    - name: Validate podman registry URL and username
      ansible.builtin.assert:
        that:
          - podman_registry_url | length > 0
          - podman_registry_url is not match('^https?://')
          - podman_registry_username | length > 0
        fail_msg: "podman_registry_url wajib diisi tanpa http(s):// dan podman_registry_username wajib diisi"
        success_msg: "Registry URL dan username valid"

    - name: Validate OpenShift API URL
      ansible.builtin.assert:
        that:
          - oc_api_url is match('^https://.+')
        fail_msg: "oc_api_url harus diawali https:// (sekarang: {{ oc_api_url }})"
        success_msg: "oc_api_url valid"

    - name: Validate secrets (token & password)
      ansible.builtin.assert:
        that:
          - oc_token is match('^sha256~.+')
          - podman_registry_password | length > 0
        fail_msg: "oc_token / podman_registry_password kosong atau formatnya salah. Cek credential 'OpenShift Login' di template."
        success_msg: "Token dan password tersedia"
      no_log: true

    # --- Pre-validation: tujuan bisa dijangkau ---
    - name: Check git repository is reachable
      ansible.builtin.command:
        argv: [git, ls-remote, "{{ git_repo_url }}", HEAD]
      delegate_to: localhost
      run_once: true
      changed_when: false

    - name: Check OpenShift API is reachable
      ansible.builtin.uri:
        url: "{{ oc_api_url }}/healthz"
        status_code: 200
      delegate_to: localhost
      run_once: true

  tasks:

    # --- Install ---
    - name: Install git, podman and python3
      ansible.builtin.dnf:
        name: [git, podman, python3]
        state: present
      become: true

    - name: Download oc CLI
      ansible.builtin.get_url:
        url: "{{ oc_cli_download_url }}"
        dest: "/tmp/openshift-client-linux.tar.gz"
        mode: "0644"

    - name: Extract oc to /usr/local/bin
      ansible.builtin.unarchive:
        src: "/tmp/openshift-client-linux.tar.gz"
        dest: "/usr/local/bin"
        remote_src: true
        mode: "0755"
      become: true

    # --- Validate ---
    - name: Check versions of all tools
      ansible.builtin.command: "{{ item }}"
      loop:
        - git --version
        - podman --version
        - python3 --version
        - oc version --client
      register: tool_versions
      changed_when: false

    - name: Show installed versions
      ansible.builtin.debug:
        msg: "{{ tool_versions.results | map(attribute='stdout') | list }}"

    # --- git clone ---
    - name: Clone the git repository
      ansible.builtin.git:
        repo: "{{ git_repo_url }}"
        dest: "{{ git_dest }}"

    # --- podman login ---
    - name: Log in to the container registry with podman
      ansible.builtin.command:
        argv:
          - podman
          - login
          - "{{ podman_registry_url }}"
          - --username
          - "{{ podman_registry_username }}"
          - --password-stdin
        stdin: "{{ podman_registry_password }}"
      when: podman_registry_username | length > 0 and podman_registry_password | length > 0
      no_log: true

    # --- oc login ---
    - name: Log in to the OpenShift cluster with oc
      ansible.builtin.command:
        argv:
          - oc
          - login
          - "{{ oc_api_url }}"
          - "--token={{ oc_token }}"
      when: oc_token | length > 0
      no_log: true

    - name: Confirm oc login
      ansible.builtin.command: oc whoami
      register: oc_whoami
      changed_when: false
      when: oc_token | length > 0

    - name: Show oc login identity
      ansible.builtin.debug:
        msg: "Logged in as {{ oc_whoami.stdout }}"
      when: oc_token | length > 0