---
- name: Ensure required tooling is installed, validated and logged in
  hosts: all
  any_errors_fatal: true

  vars:
    git_repo_url: "https://github.com/ansible/ansible-examples.git"
    git_dest: "/home/{{ ansible_user }}/repo"

    podman_registry_url: "quay.io"
    podman_registry_username: ""
    podman_registry_password: ""

    oc_api_url: "https://api.example.com:6443"
    oc_token: ""

    # --- Versi tools (strict, Task 3) ---
    git_version: "2.55.0-1.fc44"
    podman_version: "5.8.1-1.fc44"
    python3_version: "3.14.3-2.fc44"
    oc_version: "4.21.30"
    oc_base_url: "https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/{{ oc_version }}"

  pre_tasks:
    # --- Pre-validation: format input ---
    - name: Validate git repository URL
      ansible.builtin.assert:
        that:
          - git_repo_url is match('^https://.+\.git$')
        fail_msg: "git_repo_url harus diawali https:// dan diakhiri .git (sekarang: {{ git_repo_url }})"
        success_msg: "git_repo_url valid"

    - name: Validate podman registry URL and username
      ansible.builtin.assert:
        that:
          - podman_registry_url | length > 0
          - podman_registry_url is not match('^https?://')
          - podman_registry_username | length > 0
        fail_msg: "podman_registry_url wajib diisi tanpa http(s):// dan podman_registry_username wajib diisi"
        success_msg: "Registry URL dan username valid"

    - name: Validate OpenShift API URL
      ansible.builtin.assert:
        that:
          - oc_api_url is match('^https://.+')
        fail_msg: "oc_api_url harus diawali https:// (sekarang: {{ oc_api_url }})"
        success_msg: "oc_api_url valid"

    - name: Validate secrets (token & password)
      ansible.builtin.assert:
        that:
          - oc_token is match('^sha256~.+')
          - podman_registry_password | length > 0
        fail_msg: "oc_token / podman_registry_password kosong atau formatnya salah. Cek credential 'OpenShift Login' di template."
        success_msg: "Token dan password tersedia"
      no_log: true

    # --- Pre-validation: tujuan bisa dijangkau ---
    - name: Check git repository is reachable
      ansible.builtin.command:
        argv: [git, ls-remote, "{{ git_repo_url }}", HEAD]
      delegate_to: localhost
      run_once: true
      changed_when: false

    - name: Check OpenShift API is reachable
      ansible.builtin.uri:
        url: "{{ oc_api_url }}/healthz"
        status_code: 200
      delegate_to: localhost
      run_once: true

  tasks:

    # --- Install (exact versions) ---
    - name: Install git, podman and python3 (exact versions)
      ansible.builtin.dnf:
        name:
          - "git-{{ git_version }}"
          - "podman-{{ podman_version }}"
          - "python3-{{ python3_version }}"
        state: present
        allow_downgrade: true
      become: true

    - name: Download oc CLI (exact version, verified checksum)
      ansible.builtin.get_url:
        url: "{{ oc_base_url }}/openshift-client-linux-{{ oc_version }}.tar.gz"
        dest: "/tmp/openshift-client-linux-{{ oc_version }}.tar.gz"
        checksum: "sha256:{{ oc_base_url }}/sha256sum.txt"
        mode: "0644"

    - name: Extract oc to /usr/local/bin
      ansible.builtin.unarchive:
        src: "/tmp/openshift-client-linux-{{ oc_version }}.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include: [oc]
        mode: "0755"
      become: true

    # --- Validate versions ---
    - name: Get installed package versions
      ansible.builtin.package_facts:

    - name: Get oc client version
      ansible.builtin.command: oc version --client -o json
      register: oc_client
      changed_when: false

    - name: Verify all tools match the expected versions
      ansible.builtin.assert:
        that:
          - (ansible_facts.packages['git'][0].version ~ '-' ~ ansible_facts.packages['git'][0].release) == git_version
          - (ansible_facts.packages['podman'][0].version ~ '-' ~ ansible_facts.packages['podman'][0].release) == podman_version
          - (ansible_facts.packages['python3'][0].version ~ '-' ~ ansible_facts.packages['python3'][0].release) == python3_version
          - (oc_client.stdout | from_json).releaseClientVersion == oc_version
        fail_msg: >-
          Versi tidak sesuai. Terpasang:
          git={{ ansible_facts.packages['git'][0].version }}-{{ ansible_facts.packages['git'][0].release }},
          podman={{ ansible_facts.packages['podman'][0].version }}-{{ ansible_facts.packages['podman'][0].release }},
          python3={{ ansible_facts.packages['python3'][0].version }}-{{ ansible_facts.packages['python3'][0].release }},
          oc={{ (oc_client.stdout | from_json).releaseClientVersion }}
        success_msg: "Semua tools sesuai versi yang ditentukan"

    # --- git clone ---
    - name: Clone the git repository
      ansible.builtin.git:
        repo: "{{ git_repo_url }}"
        dest: "{{ git_dest }}"

    # --- podman login ---
    - name: Log in to the container registry with podman
      ansible.builtin.command:
        argv:
          - podman
          - login
          - "{{ podman_registry_url }}"
          - --username
          - "{{ podman_registry_username }}"
          - --password-stdin
        stdin: "{{ podman_registry_password }}"
      no_log: true

    # --- oc login ---
    - name: Log in to the OpenShift cluster with oc
      ansible.builtin.command:
        argv:
          - oc
          - login
          - "{{ oc_api_url }}"
          - "--token={{ oc_token }}"
      no_log: true

    - name: Confirm oc login
      ansible.builtin.command: oc whoami
      register: oc_whoami
      changed_when: false

    - name: Show oc login identity
      ansible.builtin.debug:
        msg: "Logged in as {{ oc_whoami.stdout }}"